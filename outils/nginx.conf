# Configuration nginx du conteneur de demonstration.
#
# Reprend l essentiel de celle du NAS. ⚠️ Le `no-cache` porte aussi sur le JSON
# et le SVG, et pas seulement sur html/css/js : une fixture regeneree ou une
# icone redessinee ne changeraient jamais a l ecran sans ca. Le piege a deja ete
# vecu cote NAS le 16/08/2026 avec les icones, restees en cache alors qu elles
# avaient ete refaites.

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    # Revalidation systematique : le navigateur recoit un 304 quand rien n a
    # bouge, donc le cout est nul, mais il ne sert jamais une version perimee.
    location ~* \.(html|css|js|json|svg|ico)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
