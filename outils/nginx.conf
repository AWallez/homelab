# Configuration nginx du conteneur de demonstration.
#
# Reprend celle du NAS (`collecteurs/nginx.conf`), durcissement compris, pour
# qu une regle qui casserait la page casse ICI d abord : la politique de
# securite (CSP) surtout, qui bloque en silence tout ce qu elle n autorise pas.
# Deux ecarts seulement : le nom d hote, et PAS d identifiant sur les
# ecritures, la demonstration n ayant rien a proteger.
#
# ⚠️ Le `no-cache` porte aussi sur le JSON et le SVG, et pas seulement sur
# html/css/js : une fixture regeneree ou une icone redessinee ne changeraient
# jamais a l ecran sans ca. Le piege a deja ete vecu cote NAS le 16/08/2026.
# ⚠️ `add_header` NE S HERITE PAS : un seul `add_header` dans une `location`
# efface ceux du `server`. Le cache est donc regle par `expires`, qui n en est
# pas un, et les en-tetes de securite ne sont poses qu une fois.

# Suggestions de recherche : une saisie, une requete (voir `location = /suggestions`)
limit_req_zone $binary_remote_addr zone=suggestions:1m rate=10r/s;

map $request_method $journal {
    HEAD    0;
    default 1;
}

server {
    listen 80 default_server;
    return 444;
}

server {
    listen       80;
    server_name  localhost 127.0.0.1;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;
    server_tokens off;
    access_log /var/log/nginx/access.log combined if=$journal;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action https://www.google.com" always;

    # Les seuls fichiers inscriptibles, et uniquement en PUT. Repris du NAS pour
    # que le comportement local soit celui de la production : sans ca, les
    # boutons de la carte PC repondraient 405 en local et 204 sur le NAS.
    location ~ ^/data/(shortcuts|trigger|pc)\.json$ {
        dav_methods PUT;
        create_full_put_path off;
        dav_access user:rw group:rw all:r;
        client_max_body_size 64k;
        expires -1;
    }

    # SUGGESTIONS DE RECHERCHE (17/10/2026). La page ne parle qu a son propre
    # serveur (CSP `connect-src 'self'`) : ce relais transmet la saisie a Google
    # et rend sa liste (`["saisie", ["suggestion", ...]]`).
    # ⚠️ AUCUN EN-TETE DU NAVIGATEUR NE PASSE (`proxy_pass_request_headers off`) :
    # ni cookie, ni identifiant du portail (`Authorization`), ni adresse.
    # Resolveur : le DNS de Docker (reseau nomme), les adresses de Google changent.
    location = /suggestions {
        limit_req zone=suggestions burst=20 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=300s ipv6=off;
        resolver_timeout 3s;
        proxy_pass https://suggestqueries.google.com/complete/search?client=firefox&hl=fr&oe=utf-8&q=$arg_q;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host suggestqueries.google.com;
        proxy_set_header Accept-Language "fr-FR,fr;q=0.9";
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 4s;
        proxy_hide_header Set-Cookie;
        expires 5m;
        access_log off;
    }

    location ~* \.json$ {
        expires -1;
        access_log off;
    }

    # Revalidation systematique : le navigateur recoit un 304 quand rien n a
    # bouge, donc le cout est nul, mais il ne sert jamais une version perimee.
    location ~* \.(html|css|js|svg|ico)$ {
        expires -1;
    }

    location ^~ /icons/sites/ {
        expires -1;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
