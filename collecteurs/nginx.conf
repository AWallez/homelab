# Configuration nginx de PRODUCTION : conteneur `homelab`, port 3000 du NAS.
#
# Durcie le 08/10/2026 (audit, etape 1). Chaque regle repond a un constat :
#   - un nom d hote inconnu est refuse : sans ca, une page piegee pouvait faire
#     pointer un nom a elle sur l adresse du NAS (DNS rebinding) et parler au
#     portail depuis le navigateur d un visiteur, ecritures comprises ;
#   - les ecritures (raccourcis, mises a jour, PC) demandent un appareil du
#     reseau maison ou du VPN ET un identifiant (`htpasswd`, voir le compose) ;
#   - en-tetes de securite, dont une CSP stricte : la page n a aucun script en
#     ligne, tout script etranger serait bloque ;
#   - gzip (app.js : 149 Ko -> 64), JSON revalide (304) et absent du journal,
#     HEAD du rechargement automatique non journalises.
#
# ⚠️ `add_header` NE S HERITE PAS : un seul `add_header` dans une `location`
# efface ceux du `server`. Le cache est donc regle par `expires`, qui n en est
# pas un, et les en-tetes de securite ne sont poses qu une fois.
# ⚠️ Seule ligne propre a l installation : `server_name`, l adresse par laquelle
# on ouvre le portail. Toute autre adresse est refusee.

map $request_method $journal {
    HEAD    0;
    default 1;
}

# Limite des essais de mot de passe (08/10/2026) : sans elle, 30 essais
# passaient en 1,5 s depuis le reseau maison, soit une force brute a environ
# 20 mots de passe par seconde. 10 ecritures par minute et par appareil, rafale
# de 10 ; les lectures (cle vide) ne sont jamais comptees ni ralenties.
map $request_method $cle_ecriture {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
limit_req_zone $cle_ecriture zone=ecritures:1m rate=10r/m;

# Nom d hote inconnu : connexion fermee sans reponse.
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    server_name nas.local;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log /var/log/nginx/access.log combined if=$journal;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action https://www.google.com" always;

    # Seuls ces fichiers sont inscriptibles, et uniquement en PUT : raccourcis,
    # demande de mise a jour, demande d allumage ou d extinction du PC.
    # La lecture reste ouverte : la page les relit.
    location ~ ^/data/(shortcuts|trigger|pc)\.json$ {
        dav_methods PUT;
        create_full_put_path off;
        dav_access user:rw group:rw all:r;
        client_max_body_size 64k;
        expires -1;
        limit_req zone=ecritures burst=10 nodelay;
        limit_req_status 429;
        limit_except GET HEAD {
            allow 192.168.1.0/24;      # reseau maison
            allow 10.8.0.0/24;         # clients WireGuard (wg-easy en reseau hote)
            deny  all;
            auth_basic           "Homelab";
            auth_basic_user_file /etc/nginx/htpasswd;
        }
    }

    # Donnees : toujours revalidees (ETag -> 304 si rien n a change), et hors du
    # journal, que la page relit sinon des milliers de fois par heure.
    location ~* \.json$ {
        expires -1;
        access_log off;
    }

    # Page et scripts : toujours revalides.
    location ~* \.(html|css|js|svg|ico)$ {
        expires -1;
    }

    # Icones des raccourcis, recuperees sur les sites eux-memes par
    # `favicons.py` : un SVG etranger servi depuis l origine du portail ne doit
    # rien pouvoir executer s il est ouvert directement.
    location ^~ /icons/sites/ {
        expires -1;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
