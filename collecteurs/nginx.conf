server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Seul ce fichier est inscriptible, et uniquement en PUT.
    location ~ ^/data/(shortcuts|trigger)\.json$ {
        dav_methods PUT;
        create_full_put_path off;
        dav_access user:rw group:rw all:r;
        client_max_body_size 64k;
    }

    # Page et scripts : toujours revalidés (ETag -> 304 si rien n a changé).
    # Les fichiers font quelques kilo-octets, le coût est nul.
    location ~* \.(html|css|js|svg|ico)$ {
        add_header Cache-Control "no-cache";
    }
}
