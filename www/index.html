<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Crect x='7' y='8' width='18' height='6' rx='2' fill='%230e8c8a'/%3E%3Crect x='7' y='18' width='18' height='6' rx='2' fill='%232670d6'/%3E%3C/svg%3E">
<!-- Ecran d accueil de l iPhone et installation (09/10/2026) : icone, nom,
     ouverture plein ecran sans la barre de Safari. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/app-180.png">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Homelab">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="fond.css">
<!-- Bento : styles propres a chaque carte, par groupe, ciblés par
     `.card[data-carte="…"]`. Chargés APRÈS les feuilles communes. -->
<link rel="stylesheet" href="bento/base.css">
<link rel="stylesheet" href="bento/portfolio.css">
<link rel="stylesheet" href="bento/mediatheque.css">
<link rel="stylesheet" href="bento/telechargement.css">
<link rel="stylesheet" href="bento/supervision-a.css">
<link rel="stylesheet" href="bento/supervision-b.css">
<link rel="stylesheet" href="bento/reseau.css">
<link rel="stylesheet" href="bento/bureau.css">
  <meta name="referrer" content="no-referrer">
</head>
<body>
<div class="aurora"></div>
<main>
  <div id="bar" class="bar"></div>
  <!-- Donnees figees ou releves en echec : vide quand tout se met a jour. -->
  <div id="fige" class="fige" role="status"></div>
  <!-- Raccourcis : trois lignes au plus, puis defilement horizontal ; les
       fleches n apparaissent que s il reste quelque chose a voir. -->
  <div class="racc">
    <button type="button" class="fl g" aria-label="Raccourcis précédents" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div id="shortcuts" class="shortcuts"></div>
    <button type="button" class="fl d" aria-label="Raccourcis suivants" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <form class="search" action="https://www.google.com/search" method="get">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" name="q" autofocus autocomplete="off" placeholder="Rechercher sur Google…" aria-label="Rechercher sur Google">
  </form>
  <!-- La barre collante : le menu des groupes, les pastilles des cartes
       allumees, puis « Compact ». Le menu et « Compact » sont poses par
       `filters()`, de part et d autre des pastilles. -->
  <div id="nav" class="nav">
    <div id="filters" class="filters"><div id="soucis" class="soucis" aria-live="polite"></div></div>
  </div>
  <!-- `bento` DES LE DEPART (18/10/2026) : c est cette classe qui elargit
       `main` (bento/base.css). Posee au premier dessin seulement, le premier
       rangement se calculait a 75rem, sans les coins, puis la page
       s elargissait et se rangeait une seconde fois, avec. -->
  <div id="groups" class="bento"></div>
</main>
<!-- `tabindex="-1"` : la fenetre peut recevoir le focus d ouverture elle-meme,
     voir « focus d ouverture » dans app.js. -->
<dialog id="dlg" class="dlg" tabindex="-1"></dialog>
<!-- `site.js` : la configuration de l installation, jamais deployee ;
     `cartes.js` : les cartes, identiques partout. Dans cet ordre. -->
<script src="site.js"></script>
<script src="cartes.js"></script>
<!-- Le rangement en bento des cartes (du calcul), utilise par app.js. -->
<script src="rangement.js"></script>
<script src="app.js"></script>
<!-- L atelier des cartes : inactif sauf avec `?atelier` dans l adresse. -->
<script src="atelier.js"></script>
</body>
</html>
