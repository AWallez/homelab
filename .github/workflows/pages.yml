# Verification du depot, puis publication de la demonstration sur GitHub Pages.
#
# ⚠️ LA PUBLICATION ATTEND LA VERIFICATION (09/10/2026) : une erreur de syntaxe
# dans un script ou une fixture JSON cassee ne part plus en ligne. Sur une
# demande de fusion, seule la verification tourne.
#
# ⚠️ SEUL `www/` EST PUBLIE. Pages ne sait servir qu une racine ou `/docs`, et le
# front vit dans `www/` : c est ce workflow qui fait le pont, en televersant ce
# seul dossier comme racine du site. Le lien du README reste donc
# https://awallez.github.io/homelab/ sans `/www` au bout.
#
# ⚠️ La demonstration s active par la presence de `www/fixtures/scenarios.json`,
# qui est versionne. Rien a activer ici, et rien a desactiver au deploiement du
# vrai tableau de bord, qui passe par `outils/deploie.js` et ne connait pas ce
# fichier.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Le jeton n a que ce qu il faut pour publier, rien pour ecrire dans le depot.
permissions:
  contents: read
  pages: write
  id-token: write

# Deux poussees rapprochees ne doivent pas se depasser l une l autre.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntaxe JavaScript (page et outils)
        run: for f in www/*.js outils/*.js; do node --check "$f"; done

      # Fixtures, manifeste, donnees de demonstration : un JSON casse fige la
      # demonstration sans autre message qu une page vide.
      - name: JSON valides
        run: |
          node -e '
            const fs = require("fs"), p = require("path");
            const tous = (d) => fs.readdirSync(d, { withFileTypes: true })
              .flatMap(x => x.isDirectory() ? tous(p.join(d, x.name)) : [p.join(d, x.name)]);
            let n = 0;
            for (const f of [...tous("fixtures"), ...tous("www")].filter(f => f.endsWith(".json"))) {
              JSON.parse(fs.readFileSync(f, "utf8")); n++;
            }
            console.log(n + " fichiers JSON valides");'

      # Le generateur doit tourner jusqu au bout : c est lui qui produit
      # l historique de la demonstration.
      - name: Generateur de fixtures
        run: node outils/genere-fixtures.js

      # Scripts du NAS : syntaxe, puis les ERREURS de shellcheck seulement. Les
      # avertissements de style ne bloquent pas la publication.
      - name: Scripts shell
        run: |
          for f in collecteurs/*.sh outils/*.sh; do bash -n "$f"; done
          shellcheck -S error collecteurs/*.sh outils/*.sh

      # Python : compilation, puis erreurs de syntaxe et noms indefinis.
      - name: Scripts Python
        run: |
          python -m py_compile collecteurs/*.py
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82 collecteurs/

  publication:
    needs: verification
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Icones des raccourcis de la demonstration (23/10/2026), fabriquees ici
      # par le script du NAS, sur ses raccourcis : le dossier n est JAMAIS
      # versionne, celui du NAS contenant des sites personnels (.gitignore).
      # Un site injoignable depuis GitHub garde ses initiales, sans bloquer
      # la publication.
      - name: Icones des raccourcis
        continue-on-error: true
        env:
          FAVICONS_SRC: www/data/shortcuts.json
          FAVICONS_DEST: www/icons/sites
        run: |
          pip install --quiet pillow
          python collecteurs/favicons.py -v

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: pages
        uses: actions/deploy-pages@v4
