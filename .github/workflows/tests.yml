# Tests du depot : `node --test` sur `tests/`.
#
# ⚠️ SEPARE DE `pages.yml`, et sans rien publier : ce workflow ne fait que lire
# le depot. Aucune dependance npm (Node seul, `node:test` et `node:vm`), et
# aucun acces au NAS : les collecteurs tournent avec des bouchons (voir
# `tests/aide/banc.js`).
#
# ⚠️ SHELLCHECK N EST PAS ICI, A DESSEIN : il tourne dans `pages.yml` (job
# `verification`), sur les memes evenements, avec le banc des collecteurs, et la
# publication l attend. Le repeter ici ferait deux reglages a tenir d accord.
#
# `tests/` ne part nulle part : Pages ne televerse que `www/`, et le NAS ne
# recoit que la liste blanche de `outils/deploie.js`. `tests/publication.test.js`
# le verifie.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # bash, jq, awk et flock viennent avec l image ; sans eux, les essais des
      # collecteurs seraient sautes, pas reussis : on le verifie avant.
      - name: Outils des collecteurs
        run: |
          for o in bash jq awk flock; do
            command -v "$o" >/dev/null || { echo "absent : $o"; exit 1; }
          done

      - name: node --test
        run: node --test tests/*.test.js
